[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmoxie-rag"
version = "0.1.0"
description = "Agentic RAG with multi-vector hybrid search over Qdrant"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "University of Washington Scientific Software Engineering Center" }]
dependencies = [
    "pydantic-ai>=0.8.1,<1.0",  # providers use OpenAIChatModel (0.8+)
    "fastembed>=0.5.0,<1.0",
    "docling>=1.0.0,<2.0",
    "qdrant-client>=1.11.2,<1.12",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.0.0",
    "typer>=0.21.0",
    "rich>=13.0.0,<14.0",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "httpx>=0.27.0",
    # pydantic-ai <1.0 imports opentelemetry._events, which newer
    # opentelemetry-api releases removed (1.45.1 fails; 1.43.0 works).
    "opentelemetry-api<1.44",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[qdrant]>=4.0.0",
]

[project.scripts]
llmoxie-rag = "llmoxie_rag.cli:main"

[project.urls]
Repository = "https://github.com/uw-ssec/llmoxie-rag"

[tool.hatch.build.targets.wheel]
packages = ["src/llmoxie_rag"]
