name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep pixi-version in sync with copilot-setup-steps.yml.
      - name: Install pixi and the default environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          cache: true
          locked: true

      - name: Run tests
        run: pixi run test

      - name: Run CLI tests
        run: pixi run test-cli
